# Q6A IMX519 profile v2: lower exposure target for mixed dark/bright scenes.
# Neutral colour processing; not an illuminant/CCM/lens-shading calibration.
version: 1
algorithms:
  - BlackLevel:
  - Awb:
      speed: 0.2
  - Adjust:
      gamma: 2.2
      contrast: 1.0
  - Agc:
      targetMsv: 2.0
      tolerance: 0.2
  - Af:
